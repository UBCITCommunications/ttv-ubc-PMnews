name: Fetch UBC Privacy Matters
on:
  schedule:
  - cron: '0 14 * * 1' # weekly, Mondays 14:00 UTC (7am PT)  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build_privacy.py'
      - '.github/workflows/fetch-privacy.yml'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install requests
      - name: Fetch and parse privacy announcements
        run: python build_privacy.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add privacy.json
          git diff --staged --quiet || git commit -m "Update Privacy Matters $(date -u +%FT%TZ)"
          git push
