name: Fetch Privacy Matters News

on:
  schedule:
    - cron: '0 13 * * *'   # daily at 06:00 PT
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build_privacy.py'
      - '.github/workflows/fetch-privacy.yml'

# Never let two runs of this workflow collide on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      - name: Fetch and parse news
        run: python build_privacy.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add privacy.json
          # If nothing changed, exit cleanly without committing
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update Privacy Matters $(date -u +%FT%TZ)"
          # Catch up with anything that landed while we were working, then push
          git pull --rebase --autostash
          git push
